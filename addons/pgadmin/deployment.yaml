apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: data
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "Official image starts as root and drops privileges itself"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Image writes runtime files outside mounted volumes"
    ignore-check.kube-linter.io/drop-net-raw-capability: "Third-party image, capabilities left at image defaults"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.19
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pgadmin-config
            - secretRef:
                name: pgadmin-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: pgadmin-data
          hostPath:
            path: /var/lib/antiginx/pgadmin
            type: DirectoryOrCreate
