apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pgadmin-config
            - secretRef:
                name: pgadmin-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: pgadmin-data
          hostPath:
            path: /var/lib/antiginx/pgadmin
            type: DirectoryOrCreate
