apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - kube-prometheus-stack/ingress.yaml
  - kube-prometheus-stack/storage.yaml
  - loki/deployment.yaml
  - loki/service.yaml
  - alloy/rbac.yaml
  - alloy/deployment.yaml

configMapGenerator:
  - name: loki-config
    files:
      - loki/config.yaml
  - name: alloy-config
    files:
      - alloy/config.alloy
  - name: antiginx-dashboards
    files:
      - kube-prometheus-stack/dashboards/overview.json
      - kube-prometheus-stack/dashboards/daemon.json
      - kube-prometheus-stack/dashboards/logs.json
      - kube-prometheus-stack/dashboards/security.json
      - kube-prometheus-stack/dashboards/traffic.json
      - kube-prometheus-stack/dashboards/data.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Antiginx

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 94.2.0
    releaseName: prometheus-stack
    namespace: monitoring
    valuesFile: kube-prometheus-stack/values.yaml
    includeCRDs: true
