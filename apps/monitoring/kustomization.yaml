apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - kube-prometheus-stack/ingress.yaml
  - kube-prometheus-stack/storage.yaml
  - loki/deployment.yaml
  - loki/service.yaml
  - alloy/rbac.yaml
  - alloy/deployment.yaml

configMapGenerator:
  - name: loki-config
    files:
      - loki/config.yaml
  - name: alloy-config
    files:
      - alloy/config.alloy

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 88.6.5
    releaseName: prometheus-stack
    namespace: monitoring
    valuesFile: kube-prometheus-stack/values.yaml
    includeCRDs: true
