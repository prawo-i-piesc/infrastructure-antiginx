apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: data
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "Official image starts as root and drops privileges itself"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Image writes runtime files outside mounted volumes"
    ignore-check.kube-linter.io/drop-net-raw-capability: "Third-party image, capabilities left at image defaults"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-secrets
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: rabbitmq-data
          hostPath:
            path: /var/lib/antiginx/rabbitmq
            type: DirectoryOrCreate
