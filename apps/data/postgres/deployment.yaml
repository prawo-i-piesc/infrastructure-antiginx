apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: data
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "Official image starts as root and drops privileges itself"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Image writes runtime files outside mounted volumes"
    ignore-check.kube-linter.io/drop-net-raw-capability: "Third-party image, capabilities left at image defaults"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: postgres-data
          hostPath:
            path: /var/lib/antiginx/postgres
            type: DirectoryOrCreate
