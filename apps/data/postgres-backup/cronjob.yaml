apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cronjob
  namespace: data
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "pg_dump writes to a root-owned hostPath"
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Warsaw
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              image: postgres:18.7-alpine
              envFrom:
                - secretRef:
                    name: postgres-secrets
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e; umask 077; export PGPASSWORD="$POSTGRES_PASSWORD"
                  FILE="/backups/${POSTGRES_DB}-$(date +%F).dump"
                  for i in $(seq 30); do pg_isready -q -h postgres-service && break; sleep 2; done
                  pg_dump -h postgres-service -U "$POSTGRES_USER" -Fc -f "$FILE.tmp" "$POSTGRES_DB"
                  mv "$FILE.tmp" "$FILE"
                  find /backups -name "*.dump*" -mtime +7 -delete
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              hostPath:
                path: /var/backups/antiginx/postgres
                type: DirectoryOrCreate
