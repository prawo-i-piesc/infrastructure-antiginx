apiVersion: apps/v1
kind: Deployment
metadata: 
  name: engine-deployment
  namespace: antiginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          image: ghcr.io/prawo-i-piesc/engine-antiginx:latest
          ports:
            - containerPort: 5000
          env:
            - name: BACK_URL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: BACK_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: RABBITMQ_URL
            - name: ENGINE_ANTIGINX_CALL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: ENGINE_ANTIGINX_CALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"