apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon-deployment
  namespace: antiginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: daemon
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: daemon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: daemon
          image: ghcr.io/prawo-i-piesc/daemon-antiginx:latest
          ports:
            - containerPort: 5000
          env:
            - name: BACK_URL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: BACK_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: RABBITMQ_URL
            - name: ENGINE_ANTIGINX_CALL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: ENGINE_ANTIGINX_CALL
            - name: PROMETHEUS_PORT
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: PROMETHEUS_PORT
            - name: RABBITMQ_QUEUE_NAME
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: RABBITMQ_QUEUE_NAME
            - name: RABBITMQ_RESULTS_QUEUE
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: RABBITMQ_RESULTS_QUEUE
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
