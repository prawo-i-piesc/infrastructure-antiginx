apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: antiginx
resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - daemon/deployment.yaml
  - daemon/service.yaml
  - daemon/servicemonitor.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: backend-config
    envs:
      - backend/config.env
  - name: daemon-config
    envs:
      - daemon/config.env
  - name: frontend-config
    envs:
      - frontend/config.env
