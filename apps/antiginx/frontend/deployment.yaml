apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: antiginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/prawo-i-piesc/frontend-antiginx:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          env:
            - name: BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: BACKEND_URL
            - name: TRUST_PROXY_HEADERS
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: TRUST_PROXY_HEADERS
                  optional: true
            - name: COOKIE_SECURE
              valueFrom:
                secretKeyRef:
                  name: antiginx-secrets
                  key: COOKIE_SECURE
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
