apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets
  - ../../apps/antiginx
  - ../../apps/data
  - ../../apps/monitoring
  - ../../apps/ingress
  - ../../addons/scan-targets
  - ../../addons/pgadmin
  - ../../addons/rabbitmq-management

patches:
  - path: patches/frontend-ingress.yaml
    target:
      kind: Ingress
      name: frontend-ingress
      namespace: antiginx
  - path: patches/kube-prometheus-stack-ingress.yaml
    target:
      kind: Ingress
      name: grafana-ingress
      namespace: monitoring

images:
  - name: ghcr.io/prawo-i-piesc/daemon-antiginx
    newTag: 0.0.15
  - name: ghcr.io/prawo-i-piesc/backend-antiginx
    newTag: 0.6.16
  - name: ghcr.io/prawo-i-piesc/frontend-antiginx
    newTag: 0.6.21
