apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
secretGenerator:
  - name: backend-secrets
    namespace: antiginx
    envs:
      - backend.env
  - name: daemon-secrets
    namespace: antiginx
    envs:
      - daemon.env
  - name: postgres-secrets
    namespace: data
    envs:
      - postgres.env
  - name: rabbitmq-secrets
    namespace: data
    envs:
      - rabbitmq.env
  - name: monitoring-secrets
    namespace: monitoring
    envs:
      - monitoring.env
    options:
      disableNameSuffixHash: true
  - name: traefik-secrets
    namespace: kube-system
    envs:
      - traefik.env
    options:
      disableNameSuffixHash: true
