name: Lint Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('Lint Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('Lint Verification for CI: Merge -> {0}', github.event.head_commit.message)
  }}

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches: ["main"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint-ci-test:
        name: YAML Lint
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
        - name: 📥 Git -- Checkout repository
          uses: actions/checkout@v7

        - name: 📦 Yamllint -- Install
          run: |
            pipx install yamllint==1.38.0

        - name: 🧪 Yamllint -- Test YAML Files
          run: |
            echo "⚙️ Running yamllint on repository:"
            if yamllint -c .yamllint.yml -f github .; then
                echo ""
                echo "✅ No YAML errors found."
            else
                echo ""
                echo "❌ YAML errors found. Please fix the errors above."
                exit 1
            fi
